services:
  postgres:
    image: postgres:16-alpine
    container_name: kidscare-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kidscare_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-kidscare}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kidscare-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kidscare-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ALLOWED_ORIGINS: '*'
      DATABASE_URL: ${DATABASE_URL:-postgresql://kidscare_migrator:migrator_pw@postgres:5432/kidscare?schema=public}
      DATABASE_APP_URL: ${DATABASE_APP_URL:-postgresql://kidscare_app:app_pw@postgres:5432/kidscare?schema=public}
      DATABASE_AUTH_LOOKUP_URL: ${DATABASE_AUTH_LOOKUP_URL:-postgresql://kidscare_auth_lookup:auth_pw@postgres:5432/kidscare?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-kidscare_super_secret_jwt_key_2026}
    expose:
      - '3000'
    ports:
      - '3005:3000'

  web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: kidscare-web
    restart: always
    depends_on:
      - api
    expose:
      - '80'
    ports:
      - '8085:80'

volumes:
  postgres_data:
  redis_data:
